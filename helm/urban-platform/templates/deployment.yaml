{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "urban.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  {{- if not (and $svc.hpa $svc.hpa.enabled) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
          envFrom:
            - configMapRef:
                name: urban-config
            {{- range $svc.secretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $svc.modelsVolume }}
          volumeMounts:
            - name: models-cache
              mountPath: /models
          {{- end }}
          {{- if $svc.probes }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probes.readiness }}
              port: {{ $svc.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $svc.probes.liveness }}
              port: {{ $svc.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
      {{- if $svc.modelsVolume }}
      volumes:
        - name: models-cache
          emptyDir: {}
      {{- end }}
{{- end }}
{{- end }}
