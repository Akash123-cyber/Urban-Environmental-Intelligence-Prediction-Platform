name: urban-platform

x-common-env: &common-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-urban}:${POSTGRES_PASSWORD:-urban_dev_password}@postgres:5432/${POSTGRES_DB:-urban}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  S3_ENDPOINT_URL: http://minio:9000
  S3_RAW_BUCKET: ${S3_RAW_BUCKET:-urban-raw}
  S3_PROCESSED_BUCKET: ${S3_PROCESSED_BUCKET:-urban-processed}
  S3_MODEL_BUCKET: ${S3_MODEL_BUCKET:-urban-models}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urban_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-urban}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urban} -d ${POSTGRES_DB:-urban}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      mc mb -p local/${S3_RAW_BUCKET:-urban-raw} local/${S3_PROCESSED_BUCKET:-urban-processed} local/${S3_MODEL_BUCKET:-urban-models};
      exit 0;
      "
    restart: "no"

  data-processor:
    build:
      context: ./services/data-processor
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports: ["5000:5000"]

  data-collector:
    build:
      context: ./services/data-collector
    environment:
      PROCESSOR_URL: http://data-processor:5000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-900}
      LIVE_LOOKBACK_HOURS: "2"
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CITIES_CSV_PATH: data/cities.csv
    volumes:
      - ./data/cities.csv:/app/data/cities.csv:ro
    depends_on:
      data-processor:
        condition: service_started
    ports: ["8080:8080"]

  analytics-service:
    build:
      context: ./services/analytics-service
    environment:
      <<: *common-env
      ANALYTICS_INTERVAL_SECONDS: ${ANALYTICS_INTERVAL_SECONDS:-1800}
      USE_PRETRAINED: "true"
      MODEL_S3_PREFIX: models/latest/
      MODEL_DIR: /models
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - models:/models
    ports: ["5001:5001"]

  api-service:
    build:
      context: ./services/api-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-urban}:${POSTGRES_PASSWORD:-urban_dev_password}@postgres:5432/${POSTGRES_DB:-urban}
      ANALYTICS_URL: http://analytics-service:5001
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      analytics-service:
        condition: service_started
    ports: ["3000:3000"]

  web-dashboard:
    build:
      context: ./services/web-dashboard
    depends_on:
      - api-service
    ports: ["80:80"]

volumes:
  pgdata:
  miniodata:
  models:
