apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: urban-microservices
  namespace: urban
  labels:
    release: kps
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: ["analytics-service", "api-service", "data-collector", "data-processor"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
